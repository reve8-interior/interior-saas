services:
  - type: web
    name: designer-portal-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeploy: false # deploys are triggered by b-prod-* tags via GitHub Actions
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false # Supabase session-pooler URL, set in dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: N8N_WEBHOOK_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: API_BASE_URL
        sync: false # https://<service>.onrender.com
      - key: FRONTEND_URL
        sync: false # https://<project>.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false # same as FRONTEND_URL (comma-separated for several)
      - key: SECRETS_ENCRYPTION_KEY
        sync: false # Fernet key; encrypts per-business OpenAI keys
