name: Deploy Backend

on:
  push:
    tags:
      - "b-dev-*"
      - "b-prod-*"
  workflow_dispatch:

jobs:
  lint:
    name: Lint backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.21
      - run: ruff check .
      - run: ruff format --check .

  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    needs: lint
    if: startsWith(github.ref, 'refs/tags/')
    environment: ${{ contains(github.ref_name, '-prod-') && 'prod' || 'dev' }}
    steps:
      - uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          wait_deploy: true
